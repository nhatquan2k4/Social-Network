services:
  mongodb:
    image: mongo:7
    container_name: social-network-mongodb
    restart: unless-stopped
    command: ["--port", "27018"]
    # Đã xóa phần 'ports' ở đây. Database giờ chỉ có thể được truy cập nội bộ bởi Backend.
    environment:
      MONGO_INITDB_DATABASE: social_network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: social-network-minio
    restart: unless-stopped
    ports:
      - "9005:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Jenkins sẽ build và push image này, VPS chỉ việc kéo về chạy
    image: ${DOCKERHUB_USERNAME}/social-network-backend:latest
    container_name: social-network-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # Tự động nạp toàn bộ danh sách biến từ file .env ẩn trên máy chủ
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mongodb_data:
  minio_data: